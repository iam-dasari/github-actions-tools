name: Java CI for SonarQube - Qualitygate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        working-directory: ecommerce-app
        run: mvn clean verify
            
      - name: SonarQube Scan & Quality Gate
        working-directory: ecommerce-app
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            -Dsonar.login="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.qualitygate.wait=true
