name: Java CI for SonarQube

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        working-directory: ecommerce-app
        run: mvn clean verify

      - name: Check SonarQube Secrets
        run: |
          echo "SONAR_HOST_URL configured: ${{ secrets.SONAR_HOST_URL != '' }}"
          echo "SONAR_TOKEN configured: ${{ secrets.SONAR_TOKEN != '' }}"
